name: cubit_template
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  core_kit: 1.0.7+7
  auto_route:
  flutter_bloc:
  get_it:
  equatable:
  json_annotation:
  json_serializable:

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints:
  build_runner:
  auto_route_generator:
  flutter_launcher_icons:
  flutter_gen_runner:
  change_app_package_name: ^1.5.0
  rename_app: ^1.6.5

flutter:
  config:
    enable-swift-package-manager: false
    
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/